<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>ERP 随身助手 · 离线</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;max-width:520px;margin:auto;background:#fff;padding:calc(env(safe-area-inset-top) + 64px) 24px 40px}.icon{width:54px;height:54px;border-radius:18px;background:#dbeafe;color:#2563eb;display:grid;place-items:center;font-size:26px}.eyebrow{margin-top:34px;color:#2563eb;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{font-size:28px;line-height:1.2;letter-spacing:-.03em;margin:8px 0 12px}p{font-size:14px;line-height:1.7;color:#64748b;margin:0}button{margin-top:28px;width:100%;height:48px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:15px;font-weight:650}
    </style>
  </head>
  <body><main class="shell"><div class="icon">↻</div><div class="eyebrow">Offline</div><h1>当前没有网络</h1><p>正式业务节点需要联网确认，避免库存或状态冲突。已填写的采集草稿会保留在本机，恢复网络后可以继续提交。</p><button onclick="location.reload()">重新连接</button></main></body>
</html>
