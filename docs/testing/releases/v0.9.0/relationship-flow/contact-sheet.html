<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务邀请到长期合作 · 截图总览</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eef2f7;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: 1800px;
        margin: 0 auto;
        padding: 48px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
      }
      header p {
        margin: 10px 0 32px;
        color: #5f6b7a;
        font-size: 18px;
      }
      ol {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: evidence;
      }
      li {
        counter-increment: evidence;
        overflow: hidden;
        border: 1px solid #d8dee8;
        border-radius: 14px;
        background: white;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }
      figure {
        margin: 0;
      }
      img {
        display: block;
        width: 100%;
        height: 470px;
        object-fit: contain;
        background: #f8fafc;
        border-bottom: 1px solid #e5e7eb;
      }
      figcaption {
        min-height: 72px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        font-size: 17px;
        font-weight: 600;
      }
      figcaption::before {
        content: counter(evidence, decimal-leading-zero);
        display: grid;
        place-items: center;
        flex: 0 0 34px;
        height: 34px;
        border-radius: 50%;
        background: #2563eb;
        color: white;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>任务邀请到长期企业合作 · 浏览器验收总览</h1>
        <p>同一个个人账号，从限定邀请、任务协作到建立自己的 ERP，再到显式共享与撤权。</p>
      </header>
      <ol>
        <li>
          <figure>
            <img src="screenshots/01-owner-invites-warehouse-manager.png" alt="邀请任务负责人" />
            <figcaption>邀请方选择任务负责人</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img
              src="screenshots/02-unregistered-invitee-understands-scope.png"
              alt="未注册邀请页"
            />
            <figcaption>未注册邀请人理解协作边界</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="screenshots/03-invite-scoped-personal-registration.png" alt="限定邮箱注册" />
            <figcaption>限定邮箱注册个人账号</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="screenshots/04-registered-account-before-acceptance.png" alt="注册后接受" />
            <figcaption>注册后显式接受关系</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="screenshots/05-empty-task-portal-with-navigation.png" alt="任务空态" />
            <figcaption>无任务也不是死胡同</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img
              src="screenshots/06-relationship-home-explains-long-term-options.png"
              alt="个人协作中心"
            />
            <figcaption>个人协作中心解释长期路径</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img
              src="screenshots/07-manager-dispatch-view-keeps-recipient-private.png"
              alt="任务负责人调度"
            />
            <figcaption>任务负责人可调度但客户信息隐藏</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="screenshots/08-manager-assigned-task-to-operator.png" alt="指派任务协作者" />
            <figcaption>任务负责人将任务指派给协作者</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="screenshots/09-optional-own-erp-onboarding.png" alt="可选创建 ERP" />
            <figcaption>创建自己的 ERP 是可选项</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img src="screenshots/10-same-account-enters-own-erp.png" alt="进入自己的 ERP" />
            <figcaption>同一账号进入独立 ERP</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img
              src="screenshots/11-personal-relationship-upgraded-to-company-request.png"
              alt="升级企业合作"
            />
            <figcaption>从个人关系升级企业合作请求</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img
              src="screenshots/12-inviter-receives-company-connection-request.png"
              alt="连接请求"
            />
            <figcaption>邀请方确认对端经营主体</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img
              src="screenshots/13-company-connection-confirmed-without-data-grant.png"
              alt="连接无自动授权"
            />
            <figcaption>企业连接不自动授权数据</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img
              src="screenshots/14-explicit-offer-grant-to-connected-company.png"
              alt="显式货盘授权"
            />
            <figcaption>货主显式选择可见企业</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img
              src="screenshots/15-own-erp-sees-only-explicitly-shared-offer.png"
              alt="对端看到货盘"
            />
            <figcaption>对端只看到明确共享的货盘</figcaption>
          </figure>
        </li>
        <li>
          <figure>
            <img
              src="screenshots/16-disconnection-revokes-future-offer-access.png"
              alt="断开撤权"
            />
            <figcaption>断开连接立即撤销未来访问</figcaption>
          </figure>
        </li>
      </ol>
    </main>
  </body>
</html>
